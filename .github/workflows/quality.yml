name: Quality

on:
  pull_request:
  push:
    branches: [main, "session/**", "fix/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shoppilot
          POSTGRES_PASSWORD: shoppilot_dev
          POSTGRES_USER: shoppilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shoppilot -d shoppilot" --health-interval
          2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://shoppilot:shoppilot_dev@localhost:5432/shoppilot
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Repository hygiene
        run: pnpm repo:check
      - name: Production dependency audit
        run: pnpm security:dependencies
      - name: Production license policy
        run: pnpm security:licenses
      - name: Compose hardening
        run: pnpm container:check
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration tests
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
      - name: Adversarial evaluation
        run: pnpm eval
      - name: Browser journeys
        run: pnpm test:e2e

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
